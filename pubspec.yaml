name: attendance_kiosk_app
description: Enterprise attendance kiosk for mobile and tablet (Clean Architecture + Riverpod).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  fpdart: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  camera: ^0.11.1
  uuid: ^4.5.1
  intl: ^0.20.2
  tflite_flutter: ^0.11.0
  image: ^4.5.4
  firebase_core: ^4.9.0
  firebase_app_installations: ^0.4.2+2
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
